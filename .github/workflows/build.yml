name: Build APK

on:
  push:
    branches: ['**']
    # 推送 v 開頭的標籤（例如 v1.8.1）時，編譯完成後自動建立 Release 並附上 APK
    tags: ['v*']
  workflow_dispatch:

# 建立 Release 需要寫入權限
permissions:
  contents: write
  actions: read

# 同一個分支（或標籤）、同一個提交重複觸發時只留最新的一個，舊的自動取消；
# 不同提交（連續推送）和標籤與分支之間不互相取消
concurrency:
  group: build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 編譯卡住時 20 分鐘後自動失敗，不用手動取消
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 標籤版本號必須和 app/build.gradle.kts 的 versionName 一致（標籤 v1.8.1 對應 versionName "1.8.1"），
      # 不一致就直接失敗，避免標錯版本號
      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          echo "標籤版本：$TAG_VERSION，versionName：$APP_VERSION"
          if [ -z "$APP_VERSION" ]; then
            echo "::error::讀不到 app/build.gradle.kts 的 versionName"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::標籤 $GITHUB_REF_NAME 和 versionName $APP_VERSION 不一致。請刪掉這個標籤，改成 v$APP_VERSION，或先修改 versionName。"
            exit 1
          fi

      # v1.18.2：標籤指向的 commit 如果在 main 上已經編譯成功，就直接拿那次的 APK 發布，不再重編
      - name: Check CHANGELOG has this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! grep -qx "### $GITHUB_REF_NAME" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md 沒有「### $GITHUB_REF_NAME」段落，Release 說明會改用自動產生的"
          fi

      - name: Look for an earlier successful build of this commit
        id: reuse
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --workflow "${{ github.workflow }}" --commit "$GITHUB_SHA" --event push --status success --json databaseId,headBranch --jq '[.[] | select(.headBranch=="main")][0].databaseId' 2>/dev/null || true)
          echo "reuse=false" >> "$GITHUB_OUTPUT"
          if [ -n "$RUN" ] && [ "$RUN" != "null" ]; then
            mkdir -p prebuilt
            gh run download "$RUN" --name ArcheryCounter-apk --dir prebuilt || true
            APK=$(find prebuilt -name app-release.apk 2>/dev/null | head -n 1)
            if [ -n "$APK" ]; then
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              echo "apk=$APK" >> "$GITHUB_OUTPUT"
              echo "沿用 main 上第 $RUN 次編譯的 APK，不重新編譯"
              exit 0
            fi
          fi
          echo "找不到可沿用的編譯，改為完整編譯"

      - uses: actions/setup-java@v5
        if: steps.reuse.outputs.reuse != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.reuse.outputs.reuse != 'true'
        with:
          gradle-version: 8.9

      # 固定簽章：倉庫的 Secrets 裡有 KEYSTORE_BASE64 才啟用；沒有就退回 debug 金鑰，編譯不會失敗
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "使用固定簽章金鑰"
          else
            echo "沒有設定 KEYSTORE_BASE64，使用 debug 金鑰（每次編譯的簽章都不同）"
          fi

      # 發布 Release 時一定要用固定金鑰，否則使用者之後更新會遇到簽章不符（INSTALL_FAILED_UPDATE_INCOMPATIBLE）
      - name: Require fixed signing key for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "::error::沒有設定固定簽章金鑰（Secrets 裡缺 KEYSTORE_BASE64），不發布 Release。請先設定四個 Secrets，再重新打標籤。"
            exit 1
          fi

      # 單元測試（v1.14.2 起）：失敗就停，並把失敗的測試名稱輸出成註解
      - name: Unit tests
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon 2>&1 | tee test.log || {
            grep -E "^e: " test.log | sed 's/^e: file:\/\/\/.*archerycounter\///; s/^/::error::/' | head -40
            grep -E "FAILED|AssertionError|Exception" test.log | sed 's/^/::error::/' | head -40
            exit 1
          }

      # 同時編譯 release APK（較快，建議使用）、debug APK（備用），以及上架 Google Play 用的 AAB
      - name: Build APKs and AAB
        if: steps.reuse.outputs.reuse != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          # 編譯錯誤同時輸出成註解，日誌讀不到時也看得到是哪一行
          gradle :app:assembleRelease :app:assembleDebug :app:bundleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: " build.log | sed 's/^e: file:\/\/\/.*archerycounter\///; s/^/::error::/' | head -40
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: steps.reuse.outputs.reuse != 'true'
        with:
          name: ArcheryCounter-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk

      # 上架 Google Play 用的 App Bundle（.aab），在 Actions 的 Artifacts 下載，不放進 GitHub Release
      - uses: actions/upload-artifact@v4
        if: steps.reuse.outputs.reuse != 'true'
        with:
          name: ArcheryAssistant-aab
          path: app/build/outputs/bundle/release/app-release.aab

      # 只有推送 v 開頭的標籤時才發布。只附 release 版，檔名帶版本號。
      # 同一個標籤重跑時，會覆蓋已存在的 Release 裡的同名檔案。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          REUSED_APK: ${{ steps.reuse.outputs.apk }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="ArcheryAssistant-v${VERSION}.apk"
          SRC="app/build/outputs/apk/release/app-release.apk"
          if [ -n "$REUSED_APK" ]; then SRC="$REUSED_APK"; fi
          cp "$SRC" "$FILE"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber
          else
            # 說明用 CHANGELOG.md 裡這個版本的段落；找不到就用 GitHub 自動產生的
            awk -v v="### $GITHUB_REF_NAME" '$0==v{f=1;next} /^### /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md" || true
            if [ -s "$RUNNER_TEMP/notes.md" ]; then
              gh release create "$GITHUB_REF_NAME" "$FILE" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
            else
              gh release create "$GITHUB_REF_NAME" "$FILE" --title "$GITHUB_REF_NAME" --generate-notes
            fi
          fi
          echo "已發布 $GITHUB_REF_NAME：$FILE"
